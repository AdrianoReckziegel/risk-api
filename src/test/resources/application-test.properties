spring.application.name=risk-api

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

management.info.env.enabled=true

info.app.name=Risk Assessment API
info.app.description=REST API for customer risk assessment and scoring
info.app.version=test

logging.level.org.springframework.security=DEBUG

jwt.secret=TestSecretKeyForUnitTestsOnlyNotForProduction123456789
jwt.expiration=3600000

app.bootstrap-admin.enabled=false
app.bootstrap-admin.username=admin
app.bootstrap-admin.password=testpass

server.forward-headers-strategy=framework
