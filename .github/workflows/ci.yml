on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: riskdb
          POSTGRES_USER: riskuser
          POSTGRES_PASSWORD: riskpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U riskuser -d riskdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5



    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/riskdb
          SPRING_DATASOURCE_USERNAME: riskuser
          SPRING_DATASOURCE_PASSWORD: riskpass
        run: ./mvnw test

      - name: Build application
        run: ./mvnw package -DskipTests

      - name: Build Docker image
        run: docker build -t risk-api:ci -t ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA} -t ghcr.io/${GITHUB_REPOSITORY,,}:latest .

      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}
          docker push ghcr.io/${GITHUB_REPOSITORY,,}:latest

  deploy-to-vps:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}
            git pull --ff-only origin main
            docker compose up -d --build --remove-orphans
