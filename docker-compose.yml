services:
  postgres:
    image: postgres:16
    container_name: risk-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riskdb}
      POSTGRES_USER: ${POSTGRES_USER:-riskuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riskpass}
    ports:
      - "127.0.0.1:5463:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riskuser} -d ${POSTGRES_DB:-riskdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: risk-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-riskdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-riskuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-riskpass}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      APP_VERSION: ${APP_VERSION:-1.0.1}
      APP_BOOTSTRAP_ADMIN_ENABLED: ${APP_BOOTSTRAP_ADMIN_ENABLED:-false}
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-admin}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-admin123}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    networks:
      - default
      - proxy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://api.adreck.ca
    container_name: risk-frontend
    restart: always
    depends_on:
      - app
    expose:
      - "80"
    environment:
      VITE_API_BASE_URL: https://api.adreck.ca
    networks:
      - default
      - proxy

volumes:
  postgres_data:

networks:
  proxy:
    external: true
